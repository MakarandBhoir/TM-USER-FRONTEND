<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | User Management</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">
    <main class="login-shell">
        <a class="login-brand" href="index.html">User Management</a>
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-heading">
                <h1 id="loginTitle">Welcome back</h1>
                <p>Sign in to your account to continue.</p>
            </div>
            <form class="login-form">
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <input type="email" id="loginEmail" name="email" placeholder="you@example.com"
                        autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <span class="login-help">Forgot password?</span>
                </div>
                <button class="btn btn-primary login-submit" type="button">Sign in</button>
                <p class="login-demo-note">Sample page only. Authentication is not connected.</p>
            </form>
        </section>
        <a class="back-link" href="index.html">← Back to user management</a>
    </main>
</body>

</html>
